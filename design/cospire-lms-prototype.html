document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ba(24,43,80,.25);color:rgba(24,43,80,.6);font:600 11px 'Figtree'\">+ topic test<\u002Fa>\n<a href=\"#\" sc-camel-on-click=\"{{ addItemText }}\" style=\"padding:6px 12px;border-radius:8px;border:1.5px dashed rgba(24,43,80,.25);color:rgba(24,43,80,.6);font:600 11px 'Figtree'\">+ text<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isScreen_a_users }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<span style=\"font:600 12px 'Figtree';color:rgba(24,43,80,.5)\">{{ usersSelectedCount }} selected<\u002Fspan>\n<div style=\"background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(24,43,80,.06)\">\n<div style=\"display:grid;grid-template-columns:.4fr 1.4fr 1.1fr 1fr;padding:9px 20px;background:#faf5e6;font:600 10px 'Figtree';letter-spacing:.06em;text-transform:uppercase;color:rgba(24,43,80,.5)\"><span><\u002Fspan><span>Student<\u002Fspan><span>Mentor<\u002Fspan><span>Last seen<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{ userRows }}\" as=\"u\" hint-placeholder-count=\"4\">\n<a href=\"#\" sc-camel-on-click=\"{{ u.onClick }}\" style=\"display:grid;grid-template-columns:.4fr 1.4fr 1.1fr 1fr;padding:9px 20px;border-top:1px solid rgba(24,43,80,.06);font:500 12px 'Figtree';color:#182b50\"><span style=\"{{ u.checkStyle }}\">{{ u.check }}<\u002Fspan><span>{{ u.name }}<\u002Fspan><span>{{ u.mentor }}<\u002Fspan><span>{{ u.lastSeen }}<\u002Fspan><\u002Fa>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isScreen_m_queue }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;gap:20px;height:calc(100vh - 160px);min-width:0\">\n<div style=\"width:200px;flex:none;background:#fff;border-radius:12px;padding:10px;overflow:auto;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 2px rgba(24,43,80,.06)\">\n<sc-for list=\"{{ mentorRows }}\" as=\"m\" hint-placeholder-count=\"4\">\n<a href=\"#\" sc- >\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst QUESTIONS = [\n  {topic:'Ratios', text:'A mix of nuts contains cashews and almonds in a 3:2 ratio. If there are 45 cashews, how many almonds are there?', options:['20','25','30','35'], correct:2},\n  {topic:'Percentages', text:'A jacket priced at $80 is discounted by 25%. What is the sale price?', options:['$55','$60','$65','$70'], correct:1},\n  {topic:'Averages', text:'The average of five numbers is 18. If one number is removed, the average becomes 20. What was the removed number?', options:['8','10','12','14'], correct:1},\n  {topic:'Profit & loss', text:'A vendor buys apples at $2 each and sells them at $2.50 each. What is the profit percentage?', options:['20%','25%','30%','35%'], correct:1},\n  {topic:'Time & work', text:'A can finish a task in 6 days, B in 8 days. Working together, how many days will they take?', options:['3.4','3.43','4','4.5'], correct:1},\n  {topic:'Algebra', text:'If 3x + 7 = 25, what is the value of x?', options:['4','5','6','7'], correct:2},\n  {topic:'Geometry', text:'What is the sum of the interior angles of a hexagon?', options:['540°','630°','720°','900°'], correct:2},\n  {topic:'Number series', text:'Find the next number in the series: 2, 6, 12, 20, 30, ?', options:['40','42','44','36'], correct:1},\n];\nconst PLAYER_ITEMS = [\n  {type:'video', label:'Percentages', done:true},\n  {type:'doc', label:'Formula sheet', done:true},\n  {type:'video', label:'Ratios & averages', done:false},\n  {type:'test', label:'Topic test · 15 Q', done:false},\n  {type:'lock', label:'Mixtures', done:false},\n  {type:'lock', label:'Linear equations', done:false},\n];\nconst ARS_ROUNDS = [\n  {label:'College application', status:'Reviewed'},\n  {label:'Video interview', status:'Awaiting review'},\n  {label:'Extracurricular profile', status:'Not started'},\n  {label:'Interview prep', status:'Not started'},\n];\nconst ADMIN_QUEUE = [\n  {label:'Doc import · 42 parsed questions', age:'2h', screen:'a-import'},\n  {label:'Proctoring · 3 focus losses, S1042', age:'5h', screen:'a-activity'},\n  {label:'Answer key correction · Q812', age:'1d', screen:'a-bank'},\n  {label:'Unusual activity · 1 account, 2 cities', age:'1d', screen:'a-activity'},\n];\nconst BANK_ROWS = [\n  {id:0, text:'If the ratio of…', topic:'Ratios', diff:'M', marks:3, section:'Aptitude'},\n  {id:1, text:'A shopkeeper marks…', topic:'Profit', diff:'E', marks:3, section:'Aptitude'},\n  {id:2, text:'Numerical · find x', topic:'Algebra', diff:'H', marks:3, section:'Aptitude'},\n  {id:3, text:'A can finish a task in 6 days…', topic:'Time & work', diff:'M', marks:3, section:'Aptitude'},\n  {id:4, text:'Which of the following passages…', topic:'RC', diff:'M', marks:4, section:'Verbal'},\n  {id:5, text:'Arrange the sentences logically', topic:'Para jumbles', diff:'M', marks:3, section:'Verbal'},\n  {id:6, text:'Which word is closest in meaning…', topic:'Vocabulary', diff:'E', marks:3, section:'Verbal'},\n  {id:7, text:'DI set · sales table', topic:'DI', diff:'M', marks:12, section:'Reasoning'},\n  {id:8, text:'Arrangements · seating puzzle', topic:'Logical puzzles', diff:'H', marks:4, section:'Reasoning'},\n  {id:9, text:'If x : y = 2 : 3, find x : z', topic:'Ratios', diff:'M', marks:3, section:'Reasoning'},\n];\nconst MOCK_SECTION_NAMES = ['Aptitude','Verbal','Reasoning'];\nconst IMPORT_ITEMS = [\n  {text:'If a train travels 60 km in 45 minutes, what is its speed in km/h?', options:['70 km/h','75 km/h','80 km/h','85 km/h'], correct:1},\n  {text:'DI set: sales table for Q4, extracted chart attached automatically.', options:['12% growth','18% growth','24% growth','30% growth'], correct:2},\n  {text:'Which word is closest in meaning to \"ubiquitous\"?', options:['Rare','Widespread','Hidden','Temporary'], correct:1},\n  {text:'A sequence follows the rule n² − 1. Find the 6th term.', options:['24','35','36','48'], correct:1},\n  {text:'Rearrange the jumbled sentence into a coherent paragraph.', options:['Order A','Order B','Order C','Order D'], correct:0},\n  {text:'If x : y = 2 : 3 and y : z = 4 : 5, find x : z.', options:['8:15','2:5','8:9','3:5'], correct:0},\n];\nconst CURRICULUM_BUILDER_ROWS = [\n  {type:'Video', label:'Percentages', meta:'18 min'},\n  {type:'Document', label:'Formula sheet.pdf', meta:'attached'},\n  {type:'Topic test', label:'Aptitude · 15 Q', meta:'same engine as mocks'},\n  {type:'Text block', label:'What to revise before section 2', meta:''},\n];\nconst USER_ROWS = [\n  {name:'Aditya S · S1042', mentor:'R. Iyer', lastSeen:'2h'},\n  {name:'Neha K · S1043', mentor:'Unassigned', lastSeen:'1d'},\n  {name:'Rahul M · S1044', mentor:'P. Nair', lastSeen:'Not yet'},\n  {name:'Sana R · S1045', mentor:'R. Iyer', lastSeen:'4h'},\n];\nconst MENTOR_QUEUE_INIT = [\n  {id:1, name:'Neha K', round:'Video interview', waiting:'waiting 3 days'},\n  {id:2, name:'Rahul M', round:'Extracurricular profile', waiting:'waiting 2 days'},\n  {id:3, name:'Sana R', round:'Interview prep', waiting:'waiting 1 day'},\n  {id:4, name:'Aditya S', round:'College application', waiting:'waiting 6 hours'},\n];\n\nfunction fmtTime(sec){ const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }\n\nclass Component extends DCLogic {\n  state = {\n    role:'student', screen:'s-home',\n    playerItemIndex:2,\n    docOpen:false,\n    testIndex:0, testAnswers:{}, testMarked:{}, testSeconds:1122,\n    reviewFilter:'all', reviewSelected:0,\n    arsRoundIndex:1,\n    importIndex:0, importDecisions:{},\n    bankSectionFilter:'Aptitude', bankDiffFilter:null,\n    builderTab:'mock', negMarking:true, proctoring:true, phoneAttempts:false,\n    mockName:'Mock 06 · Full length',\n    mockSections: [\n      {name:'Aptitude', time:40, selected:{0:true,2:true}},\n      {name:'Verbal', time:40, selected:{4:true}},\n      {name:'Reasoning', time:40, selected:{}},\n    ],\n    activeMockSectionIdx: 0, mockDiffFilter:null,\n    curriculumSections: [\n      {id:1, name:'Section 1 · Arithmetic', lock:true, items:[\n        {type:'Video', label:'Percentages', meta:'18 min'},\n        {type:'Document', label:'Formula sheet.pdf', meta:'attached'},\n        {type:'Topic test', label:'Aptitude · 15 Q', meta:'same engine as mocks'},\n        {type:'Text block', label:'What to revise before section 2', meta:''},\n      ]},\n      {id:2, name:'Section 2 · Algebra', lock:true, items:[]},\n    ],\n    activeCurriculumSectionId: 1,\n    selectedUserIds:{},\n    mentorQueue: MENTOR_QUEUE_INIT, mentorSelected: 1, feedbackDraft:'',\n  };\n\n  componentDidMount(){\n    this._timer = setInterval(()=>{\n      if(this.state.screen==='s-attempt' && this.state.testSeconds>0){\n        this.setState(s=>({testSeconds:s.testSeconds-1}));\n      }\n    },1000);\n  }\n  componentWillUnmount(){ clearInterval(this._timer); }\n\n  go(screen){ this.setState({screen}); }\n  setRole(role){ const home = role==='student'?'s-home':role==='admin'?'a-home':'m-queue'; this.setState({role, screen:home}); }\n\n  startTest(){ this.setState({screen:'s-attempt', testIndex:0, testAnswers:{}, testMarked:{}, testSeconds:1122}); }\n  submitTest(){ this.setState({screen:'s-results'}); }\n  selectAnswer(i,optIdx){ this.setState(s=>({testAnswers:{...s.testAnswers,[i]:optIdx}})); }\n  clearAnswer(){ this.setState(s=>{ const a={...s.testAnswers}; delete a[s.testIndex]; return {testAnswers:a}; }); }\n  toggleMark(){ this.setState(s=>{ const m={...s.testMarked}; m[s.testIndex]=!m[s.testIndex]; return {testMarked:m}; }); }\n  nextQuestion(){ this.setState(s=>({testIndex: Math.min(7, s.testIndex+1)})); }\n  prevQuestion(){ this.setState(s=>({testIndex: Math.max(0, s.testIndex-1)})); }\n  jumpQuestion(i){ this.setState({testIndex:i}); }\n\n  nextPlayerItem(){ this.setState(s=>({playerItemIndex: Math.min(PLAYER_ITEMS.length-1, s.playerItemIndex+1)})); }\n  setPlayerItem(i){ this.setState({playerItemIndex:i}); }\n  openDoc(){ this.setState({screen:'s-docviewer'}); }\n  closeDoc(){ this.setState({screen:'s-curriculum'}); }\n\n  setReviewFilter(f){ this.setState({reviewFilter:f, reviewSelected:0}); }\n  selectReviewQ(i){ this.setState({reviewSelected:i}); }\n  setArsRound(i){ this.setState({arsRoundIndex:i}); }\n\n  importApprove(){ this.setState(s=>({importDecisions:{...s.importDecisions,[s.importIndex]:'approved'}, importIndex:s.importIndex+1})); }\n  importReject(){ this.setState(s=>({importDecisions:{...s.importDecisions,[s.importIndex]:'rejected'}, importIndex:s.importIndex+1})); }\n  restartImport(){ this.setState({importIndex:0, importDecisions:{}}); }\n\n  setBankSectionFilter(v){ this.setState({bankSectionFilter:v}); }\n  setBankDiffFilter(v){ this.setState(s=>({bankDiffFilter: s.bankDiffFilter===v?null:v})); }\n\n  setBuilderTab(t){ this.setState({builderTab:t}); }\n  toggleSwitch(name){ this.setState(s=>({[name]:!s[name]})); }\n\n  setActiveMockSection(i){ this.setState({activeMockSectionIdx:i, mockDiffFilter:null}); }\n  setMockDiffFilter(v){ this.setState(s=>({mockDiffFilter: s.mockDiffFilter===v?null:v})); }\n  toggleMockQuestion(id){ this.setState(s=>{\n    const sections = s.mockSections.map((sec,i)=>{\n      if(i!==s.activeMockSectionIdx) return sec;\n      const sel = {...sec.selected}; if(sel[id]) delete sel[id]; else sel[id]=true;\n      return {...sec, selected:sel};\n    });\n    return {mockSections:sections};\n  }); }\n  adjustMockTime(delta){ this.setState(s=>{\n    const sections = s.mockSections.map((sec,i)=> i===s.activeMockSectionIdx ? {...sec, time: Math.max(10, sec.time+delta)} : sec);\n    return {mockSections:sections};\n  }); }\n\n  setActiveCurriculumSection(id){ this.setState({activeCurriculumSectionId:id}); }\n  addCurriculumSection(){ this.setState(s=>{\n    const n = s.curriculumSections.length+1;\n    const sections = [...s.curriculumSections, {id:Date.now(), name:'Section '+n, lock:true, items:[]}];\n    return {curriculumSections:sections, activeCurriculumSectionId: sections[sections.length-1].id};\n  }); }\n  toggleActiveSectionLock(){ this.setState(s=>({curriculumSections: s.curriculumSections.map(sec=> sec.id===s.activeCurriculumSectionId?{...sec,lock:!sec.lock}:sec)})); }\n  addCurriculumItem(type, label, meta){ this.setState(s=>({curriculumSections: s.curriculumSections.map(sec=>\n    sec.id===s.activeCurriculumSectionId ? {...sec, items:[...sec.items,{type,label,meta}]} : sec) })); }\n  removeCurriculumItem(idx){ this.setState(s=>({curriculumSections: s.curriculumSections.map(sec=>\n    sec.id===s.activeCurriculumSectionId ? {...sec, items: sec.items.filter((_,i)=>i!==idx)} : sec) })); }\n\n  toggleUserSelect(i){ this.setState(s=>({selectedUserIds:{...s.selectedUserIds,[i]:!s.selectedUserIds[i]}})); }\n\n  selectMentorItem(id){ this.setState({mentorSelected:id, feedbackDraft:''}); }\n  setFeedbackDraft(e){ this.setState({feedbackDraft: e && e.target ? e.target.value : ''}); }\n  markMentorReviewed(){ this.setState(s=>{\n    const remaining = s.mentorQueue.filter(m=>m.id!==s.mentorSelected);\n    return {mentorQueue:remaining, mentorSelected: remaining.length?remaining[0].id:null, feedbackDraft:''};\n  }); }\n\n  renderVals(){\n    const s = this.state;\n    const linkStyle = (active)=>`display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;font:500 13px 'Figtree';color:${active?'#182b50':'#fbf6e3'};background:${active?'#ffc24b':'transparent'};opacity:${active?1:0.85}`;\n    const navStyleFor = (id)=> linkStyle(s.screen===id);\n    const roleBtn = (r)=>`flex:1;text-align:center;padding:6px 0;border-radius:6px;font:600 10.5px 'Figtree';background:${s.role===r?'#ffc24b':'rgba(251,246,227,.08)'};color:${s.role===r?'#182b50':'#fbf6e3'}`;\n\n    const titles = {\n      's-home':'Home','s-curriculum':'Curriculum player','s-docviewer':'Document','s-instructions':'Mock 05 · Instructions',\n      's-attempt':'Mock 05 · In progress','s-results':'Mock 05 · Results','s-review':'Answer review','s-ars':'ARS (Application Readiness Score)',\n      'a-home':'Admin overview','a-activity':'Activity','a-bank':'Question bank','a-import':'Doc import review','a-builder':'Builders','a-users':'Users & access',\n      'm-queue':'Review queue',\n    };\n\n    const currentQ = QUESTIONS[s.testIndex];\n    const optionLetters=['A','B','C','D'];\n    const optionRows = currentQ.options.map((opt,idx)=>{\n      const selected = s.testAnswers[s.testIndex]===idx;\n      return {\n        text:opt, letter:optionLetters[idx],\n        onClick:()=>this.selectAnswer(s.testIndex, idx),\n        style:`display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;border:1.5px solid ${selected?'#182b50':'rgba(24,43,80,.15)'};background:${selected?'#f1ead2':'#fff'};font:500 13px 'Figtree'`,\n        letterStyle:`width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 11px 'Figtree';background:${selected?'#182b50':'#f1ead2'};color:${selected?'#fff':'#182b50'}`,\n      };\n    });\n    const paletteSquares = QUESTIONS.map((q,i)=>{\n      const answered = s.testAnswers[i]!==undefined, marked=s.testMarked[i], current=i===s.testIndex;\n      let bg = answered?'#182b50':'#f1ead2', color = answered?'#fff':'#182b50';\n      if(marked){ bg='#ffc24b'; color='#182b50'; }\n      return { n:i+1, onClick:()=>this.jumpQuestion(i),\n        style:`width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:600 11px 'Figtree';background:${bg};color:${color};border:${current?'2px solid #182b50':'1px solid transparent'};box-sizing:border-box` };\n    });\n\n    const CIRC = 439.8, pPuzzles=0.31, pReasoning=0.40, pRc=0.48, sum=pPuzzles+pReasoning+pRc;\n    const donut = {\n      puzzles: (pPuzzles/sum*CIRC).toFixed(1), reasoning: (pReasoning/sum*CIRC).toFixed(1), rc: (pRc/sum*CIRC).toFixed(1),\n      reasoningOffset: -(pPuzzles/sum*CIRC).toFixed(1), rcOffset: -((pPuzzles+pReasoning)/sum*CIRC).toFixed(1),\n    };\n    const score = (()=>{\n      let total=0, correctCount=0, wrongCount=0, skippedCount=0;\n      QUESTIONS.forEach((q,i)=>{ const a=s.testAnswers[i]; if(a===undefined) skippedCount++; else if(a===q.correct){correctCount++; total+=3;} else {wrongCount++; total-=1;} });\n      return { total, correctCount, wrongCount, skippedCount, pct: Math.round(correctCount/8*100) };\n    })();\n\n    const reviewStatusFor = (i)=>{ const q=QUESTIONS[i], a=s.testAnswers[i]; if(a===undefined) return 'skipped'; if(s.testMarked[i]) return 'marked'; return a===q.correct?'correct':'wrong'; };\n    const reviewFilterDefs = [ ['all','All 8'], ['wrong','Wrong'], ['marked','Marked'], ['skipped','Skipped'] ];\n    const reviewFilters = reviewFilterDefs.map(([key,label])=>({ label, onClick:()=>this.setReviewFilter(key),\n      style:`padding:7px 16px;border-radius:999px;font:600 12px 'Figtree';background:${s.reviewFilter===key?'#182b50':'#fff'};color:${s.reviewFilter===key?'#fff':'#182b50'};box-shadow:0 1px 2px rgba(24,43,80,.06)` }));\n    let filteredIdx = QUESTIONS.map((_,i)=>i).filter(i=> s.reviewFilter==='all' || reviewStatusFor(i)===s.reviewFilter);\n    if(!filteredIdx.length) filteredIdx=[0];\n    const activeReviewIdx = filteredIdx.includes(s.reviewSelected)?s.reviewSelected:filteredIdx[0];\n    const reviewList = filteredIdx.map(i=>{ const st=reviewStatusFor(i); const marks={correct:'✓',wrong:'✕',marked:'⚑',skipped:'·'};\n      return { onClick:()=>this.selectReviewQ(i), label:`Q${i+1} · ${QUESTIONS[i].topic}`, mark:marks[st],\n        style:`display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;font:500 12px 'Figtree';color:#182b50;background:${activeReviewIdx===i?'#f1ead2':'transparent'}`,\n        dotStyle:`color:${st==='wrong'?'#b5471f':st==='correct'?'#7e9682':'#182b50'};width:14px;text-align:center` };\n    });\n    const rq = QUESTIONS[activeReviewIdx];\n    const reviewQ = { n:activeReviewIdx+1, topic:rq.topic, text:rq.text,\n      yourAnswer: s.testAnswers[activeReviewIdx]!==undefined? optionLetters[s.testAnswers[activeReviewIdx]]+' · '+rq.options[s.testAnswers[activeReviewIdx]] : 'Not answered',\n      correctAnswer: optionLetters[rq.correct]+' · '+rq.options[rq.correct],\n      solution: `The correct approach is to work through the given values directly. ${rq.options[rq.correct]} satisfies every condition in the question, which you can confirm by substitution.` };\n\n    const arsRounds = ARS_ROUNDS.map((r,i)=>({ label:r.label, onClick:()=>this.setArsRound(i), mark: r.status==='Reviewed'?'✓':r.status==='Awaiting review'?'▲':'·',\n      style:`display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;font:500 12px 'Figtree';color:#182b50;background:${s.arsRoundIndex===i?'#f1ead2':'transparent'}` }));\n    const currentArsRound = ARS_ROUNDS[s.arsRoundIndex];\n\n    const playerItems = PLAYER_ITEMS.map((it,i)=>{ const active=i===s.playerItemIndex, locked=it.type==='lock';\n      const marks={video:'▶',doc:'▤',test:'✎',lock:'🔒',text:'¶'};\n      return { label:it.label, mark: it.done?'✓':(marks[it.type]||'·'), onClick: locked? (()=>{}) : (()=>this.setPlayerItem(i)),\n        style:`display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;font:500 12px 'Figtree';color:${locked?'rgba(24,43,80,.35)':'#182b50'};background:${active?'#f1ead2':'transparent'}` };\n    });\n    const currentItemLabel = PLAYER_ITEMS[s.playerItemIndex].label;\n\n    const adminQueue = ADMIN_QUEUE.map(q=>({ label:q.label, age:q.age, onClick:()=>this.go(q.screen) }));\n    const recentActivity = [\n      {label:'Completed video · Percentages', when:'Yesterday'},\n      {label:'Submitted Mock 04 · scored 124', when:'2 days ago'},\n      {label:'Mentor feedback received · College application', when:'4 days ago'},\n      {label:'Completed topic test · Arithmetic', when:'6 days ago'},\n    ];\n\n    const bankSectionChips = ['Aptitude','Verbal','Reasoning'].map(v=>({ label:v, onClick:()=>this.setBankSectionFilter(v),\n      style:`padding:6px 12px;border-radius:8px;font:600 11px 'Figtree'
